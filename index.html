<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rika's homework from Front-end Lab (FL-HU1, 2020–2021): 15 tasks from HTML basics to the History API, renovated with Vite, React 19 and TypeScript."
    />
    <title>FL-HU1 – Front-end Lab homework</title>
    <script>
      // Pick the theme before the first paint, so the page never flashes the wrong colors:
      // the visitor's saved choice, light by default. The key is this site's own: every project
      // page on mazsola739.github.io shares one localStorage, and a dark theme picked on another
      // one (the portfolio saves 'theme') must not carry over here.
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem('rika-fl-hu1:theme')
        } catch {}
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
