<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rika's homework from the EPAM Front-end Lab (FL-HU1, 2020–2021): 15 tasks from HTML basics to the History API, renovated with Vite, React 19 and TypeScript."
    />
    <title>FL-HU1 – Front-end Lab homework</title>
    <script>
      // Pick the theme before the first paint, so the page never flashes the wrong colors:
      // the visitor's saved choice, or the system setting when there is none.
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem('theme')
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
