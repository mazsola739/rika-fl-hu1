<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Functions</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main class="desktop">
      <section class="window" aria-labelledby="window-title">
        <div class="title-bar">
          <h1 class="title-bar-text" id="window-title">Functions</h1>
          <span class="title-bar-buttons" aria-hidden="true"><span>_</span><span>□</span><span>×</span></span>
        </div>
        <div class="window-body">
          <p class="lead">The examples of the task sheet, computed without the Math object.</p>
          <div class="table-wrapper">
            <table class="results">
              <thead>
                <tr>
                  <th scope="col">Call</th>
                  <th scope="col">Result</th>
                  <th scope="col">OK</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
