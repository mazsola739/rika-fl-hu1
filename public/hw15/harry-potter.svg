<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <title>Harry Potter: a surprised boy in a wizard hat says "Me?!"</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22174f"/>
      <stop offset="1" stop-color="#5b3fa0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="280" rx="8" fill="url(#sky)"/>
  <rect x="10" width="8" height="280" fill="#1a1140" opacity="0.6"/>

  <g fill="#ffe680">
    <circle cx="34" cy="66" r="2"/>
    <circle cx="176" cy="58" r="2.5"/>
    <circle cx="160" cy="150" r="1.6"/>
    <circle cx="36" cy="118" r="1.6"/>
    <circle cx="178" cy="240" r="2"/>
  </g>

  <text x="104" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#ffd34d">Harry Potter</text>

  <!-- face -->
  <circle cx="100" cy="178" r="40" fill="#ffd9b8"/>
  <circle cx="74" cy="196" r="6" fill="#ffb3a1" opacity="0.7"/>
  <circle cx="126" cy="196" r="6" fill="#ffb3a1" opacity="0.7"/>
  <!-- fringe -->
  <path d="M60 146 q20 16 42 6 q20 12 38 -6 v-4 h-80z" fill="#3a2a1a"/>
  <!-- wizard hat -->
  <path d="M58 142 L98 66 Q104 56 112 62 L144 142 Z" fill="#6c3bc4"/>
  <path d="M112 62 q14 -4 20 8" stroke="#6c3bc4" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="100" cy="142" rx="54" ry="9" fill="#4f2a96"/>
  <path d="M90 104 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z" fill="#ffd34d"/>
  <!-- lightning scar -->
  <path d="M114 152 l-5 7 h6 l-5 8" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- round glasses and big surprised eyes -->
  <g fill="#fff" stroke="#222" stroke-width="3">
    <circle cx="84" cy="178" r="12"/>
    <circle cx="116" cy="178" r="12"/>
  </g>
  <path d="M96 178h8M72 176l-10 -4M128 176l10 -4" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <circle cx="84" cy="178" r="4.5" fill="#222"/>
  <circle cx="116" cy="178" r="4.5" fill="#222"/>
  <!-- "o" mouth -->
  <ellipse cx="100" cy="202" rx="6" ry="8" fill="#7a2e2e"/>

  <!-- speech bubble -->
  <rect x="134" y="88" width="56" height="30" rx="10" fill="#fff"/>
  <path d="M146 116 l-8 14 l18 -12z" fill="#fff"/>
  <text x="162" y="109" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#22174f">Me?!</text>

  <!-- wand with a spark -->
  <path d="M26 246 L60 220" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/>
  <path d="M66 214 l2 5 5 1 -4 3 1 5 -4 -3 -4 3 1 -5 -4 -3 5 -1z" fill="#ffe680"/>

  <text x="104" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#e9dcff">J. K. Rowling</text>
</svg>
