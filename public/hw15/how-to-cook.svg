<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <title>How to Cook: a burnt black egg in a smoking pan, and the smoke alarm says "BEEP!"</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="280" rx="8" fill="url(#wall)"/>
  <rect x="10" width="8" height="280" fill="#e0a83e" opacity="0.6"/>

  <text x="104" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#5a2d0c">How to Cook</text>

  <!-- smoke alarm -->
  <circle cx="168" cy="64" r="12" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <circle cx="168" cy="64" r="3" fill="#e53935"/>
  <text x="150" y="96" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" font-weight="bold" fill="#e53935" transform="rotate(-12 150 96)">BEEP!</text>

  <!-- smoke -->
  <g fill="#6d6d6d" opacity="0.75">
    <circle cx="86" cy="118" r="12"/>
    <circle cx="100" cy="104" r="14"/>
    <circle cx="116" cy="118" r="11"/>
    <circle cx="94" cy="84" r="9"/>
    <circle cx="110" cy="76" r="7"/>
  </g>

  <!-- flames -->
  <g transform="translate(0 16)">
    <path d="M60 222 q6 -18 14 -6 q4 -14 12 -2 q6 -16 14 0 q6 -14 14 2 q6 -12 12 6 z" fill="#ff7a1a"/>
    <path d="M70 222 q5 -10 9 -2 q4 -9 8 0 q5 -10 9 0 q5 -9 9 1 q4 -7 8 2 z" fill="#ffd23f"/>
  </g>

  <!-- pan with a burnt egg -->
  <path d="M150 168 L190 152" stroke="#2b2b2b" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="96" cy="176" rx="58" ry="40" fill="#3a3a3a"/>
  <ellipse cx="96" cy="172" rx="50" ry="32" fill="#4b4b4b"/>
  <path d="M66 172 q4 -20 26 -18 q12 -14 28 0 q16 4 8 20 q-4 16 -26 12 q-18 6 -28 -2 q-12 -2 -8 -12z" fill="#1c1c1c"/>
  <circle cx="96" cy="170" r="10" fill="#3b2412"/>
  <g stroke="#1c1c1c" stroke-width="2" stroke-linecap="round">
    <path d="M60 196 l-6 6M134 196 l6 6"/>
  </g>
  <!-- the egg is not happy -->
  <circle cx="82" cy="164" r="2" fill="#fff"/>
  <circle cx="110" cy="164" r="2" fill="#fff"/>
  <path d="M88 184 q8 -6 16 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>

  <text x="104" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a2d0c">Robin Cook</text>
</svg>
